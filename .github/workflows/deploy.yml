name: Deploy to GitHub Pages

# main に入ったら静的書き出しして Pages に配る。
# next.config.ts が output: 'export' なので、out/ をそのまま上げるだけでよい。
on:
  push:
    branches: [main]
  # 手で流したいときのために
  workflow_dispatch:

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。走行中のものは終わらせてから次を出す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # out/_next/ のように _ で始まるディレクトリを Jekyll に消させない
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
