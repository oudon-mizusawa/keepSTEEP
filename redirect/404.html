<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>移転しました — keepSTEEP</title>
<!-- GitHub Pages は静的配信なので、こちらから 301 を返す手段がない。
     HTML での転送 + canonical で、閲覧者と検索エンジンの両方を新しい場所へ送る。 -->
<link rel="canonical" href="https://oudon-mizusawa.github.io/">
<meta name="robots" content="noindex, follow">
<meta http-equiv="refresh" content="0; url=https://oudon-mizusawa.github.io/">
<style>
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#e4e0da;color:#3b2f63;
    font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;text-align:center;padding:2rem}
  a{color:#26614f}
</style>
</head>
<body>
  <div>
    <p>ここは移転しました。</p>
    <p><a href="https://oudon-mizusawa.github.io/">https://oudon-mizusawa.github.io/</a></p>
  </div>
  <script>location.replace('https://oudon-mizusawa.github.io' + location.pathname.replace(/^\/keepSTEEP/i, '') + location.search + location.hash);</script>
</body>
</html>
